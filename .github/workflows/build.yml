name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip python3-virtualenv \
            autoconf automake autopoint libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libltdl-dev libssl-dev gettext build-essential ccache
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.34"
          # Buildozer 1.5.0 wraps extra Manifest application attributes in
          # literal quotes, producing invalid XML. Pin the upstream fix.
          python -m pip install "buildozer @ git+https://github.com/kivy/buildozer.git@a153097b3c534bea8a17da2abf1369d67c8cbfcb"

      - name: Prepare Android 16 compatible p4a
        shell: bash
        run: |
          git clone https://github.com/kivy/python-for-android.git .p4a-source
          git -C .p4a-source checkout 58d21141f17c889bf8585f5665921d72028f8831

          match_count="$(grep -Rho 'android:hardwareAccelerated="true"' \
            .p4a-source/pythonforandroid/bootstraps | wc -l)"
          if [ "$match_count" -lt 1 ]; then
            echo "::error::p4a SDL manifest hardware acceleration attribute was not found"
            exit 1
          fi

          grep -RIl 'android:hardwareAccelerated="true"' \
            .p4a-source/pythonforandroid/bootstraps \
            | xargs sed -i 's/android:hardwareAccelerated="true"/android:hardwareAccelerated="false"/g'

          if grep -Rq 'android:hardwareAccelerated="true"' \
            .p4a-source/pythonforandroid/bootstraps; then
            echo "::error::p4a manifest hardware acceleration patch was incomplete"
            exit 1
          fi
          echo "Patched $match_count p4a manifest attribute(s) for Android 16/ColorOS."

      - name: Build debug APK
        id: build_apk
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer.log

      - name: Report Buildozer failure
        if: failure() && steps.build_apk.outcome == 'failure'
        shell: bash
        run: |
          df -h
          echo "### Buildozer failure summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 buildozer.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          sed -E $'s/\x1B\[[0-9;]*[mK]//g' buildozer.log > buildozer-clean.log
          activity="$(grep -inE '(recipe|building|compiling|linking)' buildozer-clean.log | tail -n 25 || true)"
          errors="$(grep -inE '(^|[^[:alpha:]])(fatal )?error:|ErrorReturnCode|FAILED:' buildozer-clean.log | tail -n 50 || true)"
          command="$(grep -iE 'Command failed:|RAN:' buildozer-clean.log | tail -n 5 || true)"
          diagnostic="ACTIVITY:\n${activity}\n\nERRORS:\n${errors}\n\nFAILED COMMAND:\n${command}"

          diagnostic="${diagnostic//'%'/'%25'}"
          diagnostic="${diagnostic//$'\r'/'%0D'}"
          diagnostic="${diagnostic//$'\n'/'%0A'}"
          echo "::error title=Buildozer command failure::$diagnostic"

      - name: Upload Buildozer log on failure
        if: failure() && steps.build_apk.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: buildozer-failure-log
          path: buildozer.log
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: plantdoctor-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
