name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip python3-virtualenv \
            autoconf automake autopoint libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev gettext build-essential ccache
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.34" "buildozer==1.5.0"

      - name: Build debug APK
        id: build_apk
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer.log

      - name: Report Buildozer failure
        if: failure() && steps.build_apk.outcome == 'failure'
        shell: bash
        run: |
          df -h
          echo "### Buildozer failure summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 buildozer.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          sed -E $'s/\x1B\[[0-9;]*[mK]//g' buildozer.log > buildozer-clean.log
          command_line="$(grep -n 'Command failed:' buildozer-clean.log | tail -n 1 | cut -d: -f1 || true)"
          if [[ -n "$command_line" ]]; then
            start_line=$(( command_line > 80 ? command_line - 80 : 1 ))
            diagnostic="$(sed -n "${start_line},${command_line}p" buildozer-clean.log)"
          else
            diagnostic="$(tail -n 80 buildozer-clean.log)"
          fi

          diagnostic="${diagnostic//'%'/'%25'}"
          diagnostic="${diagnostic//$'\r'/'%0D'}"
          diagnostic="${diagnostic//$'\n'/'%0A'}"
          echo "::error title=Buildozer command failure::$diagnostic"

      - name: Upload Buildozer log on failure
        if: failure() && steps.build_apk.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: buildozer-failure-log
          path: buildozer.log
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: plantdoctor-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
