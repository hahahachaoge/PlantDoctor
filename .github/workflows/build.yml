name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip python3-virtualenv \
            autoconf automake autopoint libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev gettext build-essential ccache
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.34" "buildozer==1.5.0"

      - name: Build debug APK
        id: build_apk
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer.log

      - name: Report Buildozer failure
        if: failure() && steps.build_apk.outcome == 'failure'
        shell: bash
        run: |
          df -h
          echo "### Buildozer failure summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 buildozer.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          tail_text="$(tail -n 120 buildozer.log)"
          tail_text="${tail_text//'%'/'%25'}"
          tail_text="${tail_text//$'\r'/'%0D'}"
          tail_text="${tail_text//$'\n'/'%0A'}"
          echo "::error title=Buildozer final output::$tail_text"

      - name: Upload Buildozer log on failure
        if: failure() && steps.build_apk.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: buildozer-failure-log
          path: buildozer.log
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: plantdoctor-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
